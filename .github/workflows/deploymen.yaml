name: Build and Deploy My App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE: jl115/portfolio:${{ github.sha }}
  CONFIG_PATH: ./k8s
  KUBERNETES_NAMESPACE: portfolio
  APP_NAME: portfolio
  BASE_URL: joelleimbacher.tech
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-deploy:
    if: startsWith(github.event.head_commit.message, 'Merge pull request')
    # Only run on push or merged pull request
    runs-on: self-hosted
    name: Build and Deploy to Kubernetes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Write kubeconfig file
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > kubeconfig
          chmod 600 kubeconfig
      - name: Replace and Apply Kubernetes Manifests
        run: |
          command -v envsubst >/dev/null 2>&1 || { echo "envsubst not found"; exit 1; }
          for file in namespace.yaml envs.yaml deploy.yaml service.yaml ingress.yaml; do
            echo "--- Applying k8s/$file ---"
            cat "k8s/$file" | envsubst | kubectl apply --validate=false -f -
          done
        env:
          KUBECONFIG: kubeconfig
